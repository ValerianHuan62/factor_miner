[project]
name = "factor-miner"
version = "0.1.0"
description = "Auditable factor candidate discovery pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py>=3.16,<3.17",
  "hmmlearn>=0.3.3,<0.4",
  "polars>=1.41.0,<2",
  "pydantic>=2.13.4,<3",
  "pyyaml>=6.0.3,<7",
  "scipy>=1.17,<2",
  "statsmodels>=0.14.6,<0.15",
  "typer>=0.26.8,<0.27",
]

[project.optional-dependencies]
dashboard = [
  "psycopg[binary]>=3.3.4,<4",
  "plotly>=6.9.0,<7",
  "streamlit>=1.59.2,<2",
]

[project.scripts]
factor-miner = "factor_miner.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
