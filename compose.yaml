services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factor_miner
      POSTGRES_USER: factor_miner
      POSTGRES_PASSWORD: factor_miner_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - factor_miner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factor_miner -d factor_miner"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  factor_miner_postgres:
