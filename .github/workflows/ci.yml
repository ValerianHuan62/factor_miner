name: CI

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
      COLUMNS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: 安装冻结依赖
        run: uv sync --frozen
      - name: 运行纯合成测试
        run: uv run python -m unittest discover -s tests
